[package]
name = "coco_keyprovider"
version = "0.1.0"
authors = ["The Attestation Agent Authors"]
publish = false
edition = "2024"
license = "Apache-2.0"

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
ctr.workspace = true
daemonize = "0.5.0"
shadow-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3.32"
jwt-simple.workspace = true
kbs_protocol = { path = "../kbs_protocol", default-features = false, features = [
    "background_check",
    "rust-crypto",
] }
protos = { path = "../../protos", default-features = false, features = [
    "grpc",
] }
rand.workspace = true
reqwest.workspace = true
resource_uri.path = "../deps/resource_uri"
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tokio = { workspace = true, features = ["fs", "rt-multi-thread"] }
tonic.workspace = true
uuid = { workspace = true, features = ["fast-rng", "v4"] }

[build-dependencies]
shadow-rs.workspace = true

[dev-dependencies]
rstest.workspace = true

[features]
default = ["all-attesters"]
all-attesters = ["kbs_protocol/all-attesters"]
az-snp-vtpm-attester = ["kbs_protocol/az-snp-vtpm-attester"]
az-tdx-vtpm-attester = ["kbs_protocol/az-tdx-vtpm-attester"]
tdx-attester = ["kbs_protocol/tdx-attester"]
snp-attester = ["kbs_protocol/snp-attester"]
tpm-attester = ["kbs_protocol/tpm-attester"]
